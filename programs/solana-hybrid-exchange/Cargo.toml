[package]
name = "solana-hybrid-exchange"
version = "0.1.0"
description = "Hybrid off-chain matching, on-chain settlement exchange"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solana_hybrid_exchange"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.0.2", features = ["token_2022", "token_2022_extensions"] }
solana-instructions-sysvar = "3.0.0"
solana-sha256-hasher = "3.1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
